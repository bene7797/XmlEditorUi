name: xml_editor_flutter
description: Flutter port of the OpenQCat XML Service Editor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  xml: ^6.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  intl: ^0.20.2
  collection: ^1.19.1
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/openqcat/schema.xsd
    - assets/openqcat/templates/profiles/
    - assets/openqcat/templates/services/
    - assets/openqcat/reference/
    - assets/openqcat/reference/wertebereiche/
